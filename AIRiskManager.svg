<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff375f"/>
      <stop offset="55%" stop-color="#5e5ce6"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <rect width="800" height="450" fill="url(#glow3)"/>

  <!-- shield / risk score gauge -->
  <g transform="translate(560,110)">
    <path d="M90 0 L172 30 V110 C172 165 136 205 90 225 C44 205 8 165 8 110 V30 Z"
